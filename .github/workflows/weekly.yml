name: Weekly top 10

on:
  schedule:
    - cron: "0 10 * * 0"   # every Sunday at 10:00 UTC
  workflow_dispatch:       # lets you start it manually with a button

permissions:
  contents: write

concurrency:
  group: video-pipeline    # same group as the daily video: they never run at the same time
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts google-api-python-client google-auth

      - name: Make and upload the weekly video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MUSIC_DIR: music
          # ---- settings you can change ----
          CONTENT_MODE: facts
          LANGUAGE: English
          VOICE: en-US-AndrewNeural
          VOICE_RATE: "+6%"
          PRIVACY: public         # private, unlisted or public
          VIDEO_FORMAT: landscape # the weekly video is always widescreen
        run: python weekly.py

      - name: Save topic history
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Update history (weekly)" && git pull --rebase && git push)
